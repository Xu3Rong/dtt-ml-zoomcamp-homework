[project]
name = "kl-rental-price-prediction"
version = "0.1.0"
description = "Klang Valley (KL & Selangor) residential rental price prediction service"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.163.1",
    "numpy==2.5.5",
    "pydantic==2.14.3",
    "scikit-learn==1.9.1",
    "uvicorn==0.54.0",
    "xgboost==3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "matplotlib==3.11.2",
    "pandas==3.1.1",
    "requests==2.34.2",
    "seaborn==0.13.2",
]
